# Typprüfung: uvx mypy@2.3.1 --python-executable <venv>/bin/python; die venv per uv anlegen (siehe CLAUDE.md), HA kommt daraus
[mypy]
python_version = 3.14
files = custom_components/sf_symbols
# Platin der Integration Quality Scale: strict typing
strict = true
show_error_codes = true

# HA-Pakete exportieren Teile ihrer Schnittstelle ohne `as`
[mypy-homeassistant.*]
implicit_reexport = true
